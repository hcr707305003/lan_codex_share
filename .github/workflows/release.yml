name: test-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --version

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x64
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: macos-x64
          - runner: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate version
        shell: bash
        run: python scripts/check_version.py "$GITHUB_REF_NAME"
      - name: Validate release notes
        shell: bash
        run: python scripts/check_release_notes.py "$GITHUB_REF_NAME"
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm lan_codex_share.spec
      - name: Smoke test executable
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            executable="dist/lan_codex_share.exe"
          else
            executable="dist/lan_codex_share"
          fi
          "$executable" --version
          "$executable" --help
          "$executable" cli --help
      - name: Assemble archive
        shell: bash
        run: python scripts/package_release.py --version "${GITHUB_REF_NAME#v}" --platform "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - run: python scripts/generate_checksums.py release
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes_path="docs/releases/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes_path"
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file "$notes_path"
          fi
